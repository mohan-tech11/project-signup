<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - WarehousePro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <div class="logo-icon">📦</div>
        <span>Warehouse<span class="blue">Pro</span></span>
    </div>

    <nav>
        <a href="warehouse.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="warehouses.html">Warehouses</a>
        <a href="dispatch.html">Dispatch</a>
    </nav>

    <a href="login.html" class="login-btn">👈 Logout</a>

</header>


<main class="page">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>
            <h1>Products</h1>
            <p>Manage your warehouse products.</p>
        </div>

        <button
            class="primary-btn"
            onclick="showForm('productForm')">

            + Add Product

        </button>

    </div>


    <!-- ADD PRODUCT FORM -->

    <div class="form-box hidden" id="productForm">

        <h2>Add Product</h2>

        <form action="addProduct" method="post">

            <input
                type="text"
                name="productName"
                placeholder="Product Name"
                required
            >

            <input
                type="text"
                name="sku"
                placeholder="SKU"
                required
            >

            <input
                type="text"
                name="category"
                placeholder="Category"
            >

            <input
                type="number"
                name="price"
                placeholder="Price"
                step="0.01"
                required
            >

            <input
                type="number"
                name="quantity"
                placeholder="Quantity"
                min="0"
                required
            >

            <button
                class="primary-btn"
                type="submit">

                Save Product

            </button>

            <button
                type="button"
                class="cancel-btn"
                onclick="hideForm('productForm')">

                Cancel

            </button>

        </form>

    </div>


    <!-- PRODUCT LIST -->

    <div class="table-box">

        <h2>Product List</h2>

        <table>

            <thead>
    <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>SKU</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Action</th>
    </tr>
</thead>


            <tbody id="productTable">

                <tr>

                    <td colspan="7">
                        Loading products...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="app.js"></script>

<script>

    window.addEventListener("load", function () {

        loadProducts();

    });

</script>

</body>
</html>
